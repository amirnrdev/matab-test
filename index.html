<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مطب یار - سیستم نوبت دهی</title>
    <!-- Tailwind CSS (CDN for quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              stone: {
                850: '#1c1917',
                950: '#0c0a09',
              }
            },
            fontFamily: {
              vazir: ['Vazirmatn', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      :root {
        --ease-spring: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
      }

      body {
        font-family: 'Vazirmatn', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.3s ease;
      }
      
      .dark body {
        color: #f5f5f4; 
      }

      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
      .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
      .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

      /* Utility to hide scrollbar for clean mobile look */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* --- MODERN THEME PALETTES --- */

      /* 1. Techno / Grid (Preserved) */
      .bg-theme-grid {
        background-color: #e7e5e4; 
        color: #1c1917;
        background-image: radial-gradient(#a8a29e 1px, transparent 1px);
        background-size: 30px 30px;
        background-attachment: fixed;
      }
      .dark.bg-theme-grid, .dark .bg-theme-grid {
        background-color: #0c0a09;
        color: #e7e5e4;
        background-image: radial-gradient(#292524 1px, transparent 1px);
      }

      /* 2. Ocean (Blue) */
      .bg-theme-ocean { background-color: #eff6ff; color: #172554; }
      .dark.bg-theme-ocean, .dark .bg-theme-ocean { background-color: #172554; color: #dbeafe; }

      /* 3. Mint (Green) */
      .bg-theme-mint { background-color: #f0fdf4; color: #14532d; }
      .dark.bg-theme-mint, .dark .bg-theme-mint { background-color: #052e16; color: #dcfce7; }

      /* 4. Royal (Purple) */
      .bg-theme-royal { background-color: #faf5ff; color: #581c87; }
      .dark.bg-theme-royal, .dark .bg-theme-royal { background-color: #3b0764; color: #f3e8ff; }

      /* 5. Sunset (Orange) */
      .bg-theme-sunset { background-color: #fff7ed; color: #7c2d12; }
      .dark.bg-theme-sunset, .dark .bg-theme-sunset { background-color: #431407; color: #ffedd5; }

      /* 6. Rose (Red/Pink) */
      .bg-theme-rose { background-color: #fff1f2; color: #881337; }
      .dark.bg-theme-rose, .dark .bg-theme-rose { background-color: #4c0519; color: #ffe4e6; }

      /* 7. Steel (Slate/Gray) */
      .bg-theme-steel { background-color: #f8fafc; color: #0f172a; }
      .dark.bg-theme-steel, .dark .bg-theme-steel { background-color: #020617; color: #f1f5f9; }


      /* --- UNIFIED GLASS SYSTEM V3.2 (Reduced Blur for Visibility) --- */
      
      .glass-base, .glass-panel, .glass-card {
        background-color: rgba(255, 255, 255, 0.65); 
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        transition: all 0.4s var(--ease-out-quart);
        /* Fix for font rendering */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transform: translateZ(0); 
      }

      .dark .glass-base, .dark .glass-panel, .dark .glass-card {
        background-color: rgba(20, 20, 25, 0.65); 
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        color: #fafafa;
      }

      .glass-hover { cursor: pointer; will-change: transform, background-color; }
      
      .glass-hover:hover {
        background-color: rgba(255, 255, 255, 0.85); 
        /* Removed scale(1.01) to fix blurry text on hover */
        transform: translateY(-4px); 
        border-color: rgba(255, 255, 255, 1);
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      }
      
      .dark .glass-hover:hover {
        background-color: rgba(30, 30, 35, 0.85);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      }

      .glass-panel { border-radius: 32px; }
      .glass-card { border-radius: 24px; }

      .glass-input {
        background-color: rgba(255, 255, 255, 0.65); 
        border: 1px solid rgba(0,0,0, 0.08);
        color: #1c1917;
        transition: all 0.3s ease;
      }
      .dark .glass-input {
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }
      .glass-input:focus {
        background-color: rgba(255, 255, 255, 0.95);
        border-color: #57534e; 
        box-shadow: 0 0 0 4px rgba(87, 83, 78, 0.05);
        transform: translateY(-1px);
      }
      .dark .glass-input:focus {
        background-color: rgba(255, 255, 255, 0.2);
        border-color: #e5e5e5;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
      }
      
      @keyframes fadeScaleIn {
        0% { opacity: 0; transform: scale(0.97) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-mac-window { animation: fadeScaleIn 0.6s var(--ease-out-quart) forwards; }
      .animate-item { opacity: 0; animation: fadeScaleIn 0.5s var(--ease-out-quart) forwards; }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.9); }
        70% { transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-pop { animation: popIn 0.4s var(--ease-out-quart) forwards; }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
      
      .font-vazir { font-family: 'Vazirmatn', sans-serif; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "express": "https://esm.sh/express@^5.2.1",
    "sqlite3": "https://esm.sh/sqlite3@^5.1.7",
    "cors": "https://esm.sh/cors@^2.8.6",
    "url": "https://esm.sh/url@^0.11.4",
    "path": "https://esm.sh/path@^0.12.7",
    "mysql2": "https://esm.sh/mysql2@^3.17.1",
    "os": "https://esm.sh/os@^0.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
